<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helping Hands</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;font-family:Arial,"Noto Sans Devanagari",sans-serif}
#site{width:100%;height:100vh;border:0;display:block}

.tools{
position:fixed;
right:15px;
top:15px;
z-index:99999;
display:flex;
gap:8px;
align-items:center;
}

.lang{
background:white;
border:1px solid #ccc;
border-radius:20px;
padding:8px 12px;
font-weight:bold;
}

.whatsapp{
background:#25D366;
color:white;
text-decoration:none;
padding:10px 16px;
border-radius:25px;
font-weight:bold;
box-shadow:0 3px 10px #777;
}

.whatsapp:hover{background:#128C7E}

@media(max-width:600px){
.tools{
right:8px;
top:8px;
}
.whatsapp{
font-size:13px;
padding:8px 12px;
}
.lang{
font-size:12px;
padding:7px 9px;
}
}
</style>
</head>

<body>

<div class="tools">

<select class="lang" id="languageSelect">
<option value="hi">हिन्दी</option>
<option value="en">English</option>
<option value="mr">मराठी</option>
<option value="bn">বাংলা</option>
<option value="gu">ગુજરાતી</option>
<option value="ta">தமிழ்</option>
<option value="te">తెలుగు</option>
<option value="kn">ಕನ್ನಡ</option>
<option value="ml">മലയാളം</option>
<option value="pa">ਪੰਜਾਬੀ</option>
</select>

<a class="whatsapp"
href="https://wa.me/?text=Hello%20Helping%20Hands"
target="_blank">
💬 WhatsApp
</a>

</div>

<iframe id="site" src="Helping_Hands_Final.html"></iframe>

<script>

const frame=document.getElementById("site");

frame.onload=function(){

try{

const doc=frame.contentDocument;

/* छोटा About section */
const about=doc.querySelector("#about");

if(about){

about.innerHTML=`
<div class="container">
<div class="section-head">

<div class="kicker">मेरे बारे में</div>

<h2>Helping Hands</h2>

<p>
कई वर्षों के गहन आध्यात्मिक अध्ययन के बाद मुझे
जीवन जीने का सहज और सरल ज्ञान प्राप्त हुआ है।
2020 से मन में यह भावना रही है कि पूरी मानव जाति
के लिए कुछ किया जाए। Helping Hands की यह वेबसाइट
उसी दिशा में पहला कदम है।
</p>

</div>
</div>
`;

}

/* अंतिम संदेश */
const footer=doc.querySelector("footer");

if(footer){

const box=doc.createElement("div");

box.style.cssText=
"text-align:center;padding:30px 15px;font-size:1.25rem;font-weight:800;line-height:2;background:#103e31;color:white;";

box.innerHTML=
"सेवा ही सच्चा धर्म है<br>हर मनुष्य ईश्वर ही है 🙏";

footer.appendChild(box);

}

/* WhatsApp contact */
const contact=doc.createElement("div");

contact.innerHTML=`
<a href="https://wa.me/?text=Hello%20Helping%20Hands"
target="_blank"
style="
position:fixed;
right:18px;
bottom:18px;
z-index:999999;
background:#25D366;
color:white;
padding:13px 20px;
border-radius:30px;
font-weight:bold;
font-family:Arial,sans-serif;
text-decoration:none;
box-shadow:0 4px 15px rgba(0,0,0,.3);
">
💬 WhatsApp से संपर्क करें
</a>
`;

doc.body.appendChild(contact);

}
catch(e){
console.log(e);
}

};

/* भाषा */
document.getElementById("languageSelect").addEventListener("change",function(){

const lang=this.value;

try{

const doc=frame.contentDocument;
const innerSelect=doc.getElementById("languageSelect");

if(innerSelect){
innerSelect.value=lang;
innerSelect.dispatchEvent(new Event("change"));
}

}catch(e){}

});

</script>

</body>
</html>
